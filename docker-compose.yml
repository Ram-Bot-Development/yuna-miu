name: yuna-miu

services:
  yuna:
    build: .
    image: yuna-miu:local
    container_name: yuna-miu
    init: true
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DEPLOY_COMMANDS: "true"
      DATA_DIR: /app/data
      ENABLE_MESSAGE_CONTENT_INTENT: "true"
    volumes:
      - yuna-data:/app/data

volumes:
  yuna-data: